version: "3.8"
services:
  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-${UID:-1000}}
    ports:
      - "3000:3000"
    environment:
      # rack-session requires >= 64 bytes; Rails' cookie store derived a key
      # from shorter secrets, so the old value (1111111) now fails at boot.
      - SECRET_KEY_BASE=0000000000111111111122222222223333333333444444444455555555556666
      - APP_DB_HOST=postgres-db
      - APP_DB_USERNAME=root
      - APP_DB_PASSWORD=password
      - APP_DB=abid
      - HANAMI_ENV=staging
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
  postgres-db:
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready
      interval: 2s
      timeout: 5s
      retries: 30
