require: rubocop-rspec
inherit_gem:
  bixby: bixby_default.yml

AllCops:
  TargetRubyVersion: 3.1
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'bin/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'config/db/**/*'

# This is no longer a Rails application. bixby enables rubocop-rails, whose
# cops actively push code back toward ActiveSupport (Rails/Delegate,
# Rails/Present, Rails/TimeZone), which this port must not depend on.
Rails:
  Enabled: false

Layout/LineLength:
  Exclude:
    - 'lib/form_builder.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/batch.rb'
    - 'lib/marc_batch.rb'
    - 'lib/application_record.rb'
    - 'lib/form_builder.rb'

Metrics/MethodLength:
  Exclude:
    - 'lib/container_profile.rb'
    - 'lib/form_builder.rb'
    - 'lib/synchronizer.rb'
    - 'lib/synchronizer/marc_synchronizer.rb'
    - 'spec/support/*'

Metrics/ModuleLength:
  Exclude:
    - 'spec/support/stub_aspace.rb'
    - 'lib/form_builder.rb'

RSpec/DescribeClass:
  Exclude:
    - 'spec/system/**/*'

RSpec/ExampleLength:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: never

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/GuardClause:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Metrics/CyclomaticComplexity:
  Exclude:
    - 'config/database_url.rb'

# The form builder mirrors SimpleForm's option surface (label, as, type,
# input_class, extra, value); they are keyword arguments, not positional.
Metrics/ParameterLists:
  Exclude:
    - 'lib/form_builder.rb'
